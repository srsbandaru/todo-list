{% extends "base_master.html" %}
{% block title %}
    Task Confirm Delete
{% endblock title %}
{% block content %}
    <div class="container">
        <h1>Delete Task</h1>
        <h3 class="mt-3">Are you sure you want to delete <span class="text-danger">{{task.title}}</span>?</h3>
        <form action="" method="post">
            {% csrf_token %}
            <input class="btn btn-danger" type="submit" value="Yes">
            <button class="btn btn-warning" type="button" 
            onclick="window.location = '{% url 'tasks:TaskList' %}'">No</button>
        </form>
    </div>
{% endblock content %}
